[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vg-select-3a"
version = "0.3.0"
description = "VG Select: 3A (Automated Agentic Architecture) - scans a repository and workload profile, then recommends an agentic application architecture that balances latency and accuracy."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0", "pydantic>=2"]
pdf = ["reportlab>=4.0"]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2", "python-multipart>=0.0.9", "reportlab>=4.0"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "pydantic>=2", "python-multipart>=0.0.9", "reportlab>=4.0"]

[project.scripts]
vgselect = "vgselect3a.cli:main"
vgselect-service = "vgselect3a.service.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vgselect3a = ["examples/*.json", "service/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
